<text x="52" y="176" font-size="12.5" fill="#16a34a">小圆 x²+y²=2</text>
<text x="452" y="66" font-size="12.5" fill="#2563eb">大圆 (x−2)²+y²=4</text>
<g font-size="12" fill="#64748b" text-anchor="middle">
<text x="275" y="220">1</text><text x="350" y="220">2</text><text x="425" y="220">3</text><text x="500" y="220">4</text><text x="184" y="220">O</text>
</g>
<rect x="60" y="384" width="680" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="80" y="408" font-size="13" fill="#334155">阴影 = 满足 2 ≤ x²+y² ≤ 4x 的点：大圆里挖掉小圆那一块，左边缘落在两圆交点 x = 0.5</text>
<text x="80" y="430" font-size="13" fill="#334155">橙色那截 = 一条射线在 D 内的部分，两端就是二重积分上下限：r 从 √2 到 4cos θ</text>
<text x="80" y="452" font-size="13" fill="#334155">面积 S = 6θ₀ + √7 ≈ 9.902　　静矩 M_y = 16θ₀ + (3/2)√7 ≈ 23.320　　重心 x̄ = M_y/S ≈ 2.355</text>
<text x="80" y="474" font-size="13" fill="#334155">角度范围 ±θ₀，其中 θ₀ = arccos(√2/4) ≈ 69.3°（不是特殊角，别凑成 60° 或 π/3）</text>
