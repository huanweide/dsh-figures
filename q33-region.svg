<text x="250" y="186" font-size="13" fill="#b45309">θ</text>
<text x="246" y="148" font-size="12.5" fill="#b45309">r = √2</text>
<text x="470" y="94" font-size="12.5" fill="#b45309">r = 4cos θ</text>
